# Formatting, import sorting and linting
[tool.ruff]
line-length = 79
target-version = "py310"
extend-exclude = ["*.ipynb", "*.md", "env"]

[tool.ruff.lint]
# Syntax errors, invalid comparisons/statements, import sorting and
# NumPy 2.0 deprecations. ponytail: full pyflakes ("F") reports ~230
# existing issues; enable it once those are cleaned up.
select = ["E9", "F63", "F7", "I", "NPY201"]
# jaxtyping shape strings (e.g. "residues 37 3") aren't forward annotations
ignore = ["F722"]

[tool.ruff.lint.isort]
known-first-party = ["graphein"]

# Can reinstate later: Measures docstring coverage,
# super good for guaranteeing that there's docs!
[tool.interrogate]
exclude = ["setup.py", "docs", "build", "nbconvert_config.py"]
fail-under = 77
ignore-init-method = true
ignore-init-module = true
ignore-module = false
ignore-private = false
ignore-semiprivate = false
quiet = false
verbose = 2

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --cov graphein --cov-report xml --cov-report=term-missing"
testpaths = [
    "tests",
]
