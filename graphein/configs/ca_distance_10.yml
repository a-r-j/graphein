# Built-in config: residue-level (C-alpha) graph with peptide bonds and a
# 10 angstrom distance threshold. Edges mirror the example config in
# tests/utils/test_protein_graph_config.yml; node features are left at the
# ProteinGraphConfig default (meiler_embedding), and residues with insertion
# codes are kept, as in ProteinGraphConfig().
# See https://github.com/a-r-j/graphein/issues/123
!ProteinGraphConfig
granularity: "CA"
keep_hets: []
verbose: false
edge_construction_functions:
  - !func:graphein.protein.edges.distance.add_peptide_bonds
  - !func:graphein.protein.edges.distance.add_distance_threshold
    long_interaction_threshold: 5
    threshold: 10.0
