# Built-in default: residue-level (C-alpha) graph with peptide bonds and a
# 10 angstrom distance threshold. Mirrors the example config in
# tests/utils/test_protein_graph_config.yml, but omits node features that
# need network services so the graph can be built offline.
# See https://github.com/a-r-j/graphein/issues/123
!ProteinGraphConfig
granularity: "CA"
keep_hets: []
insertions: false
verbose: false
edge_construction_functions:
  - !func:graphein.protein.edges.distance.add_peptide_bonds
  - !func:graphein.protein.edges.distance.add_distance_threshold
    long_interaction_threshold: 5
    threshold: 10.0
