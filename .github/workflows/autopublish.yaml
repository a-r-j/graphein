# To create a release, create a tag and push it to GitHub:
#git tag -a "v0.0.1-beta" -m "beta version testing"
#git push --tags
# https://dev.to/iamtekson/publish-package-to-pypi-and-release-new-version-using-github-actions-108k
name: Publish Graphein to PyPI / GitHub

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write  # create the GitHub release
  id-token: write  # PyPI Trusted Publishing

jobs:
  build-n-publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: false  # don't build releases from a poisoned cache

      - name: Build source and wheel distributions
        run: |
          uv build
          uvx --no-build twine@7.0.0 check --strict dist/*

      # Trusted Publishing: PyPI exchanges this job's OIDC token for a
      # short-lived upload token, so no PyPI secret is stored in the repo
      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME"
