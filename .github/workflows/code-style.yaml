name: Code style checks

on: [push]

jobs:
  code-style:
    name: "Lint, format and docstring coverage"
    runs-on: "ubuntu-latest"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install code style checking tools
        run: "python -m pip install --only-binary :all: ruff==0.17.3 interrogate==1.7.0"

      - name: Lint and check import order
        run: ruff check --output-format=github .

      - name: Check formatting
        run: ruff format --check .

      - name: Check docstring coverage
        run: interrogate graphein
