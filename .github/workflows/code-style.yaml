name: Code style checks

on: [push]

permissions:
  contents: read

jobs:
  code-style:
    name: "Lint, format and docstring coverage"
    runs-on: "ubuntu-latest"
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install code style checking tools
        run: "python -m pip install --only-binary :all: ruff==0.17.3 interrogate==1.7.0"

      - name: Lint and check import order
        run: ruff check --output-format=github .

      - name: Check formatting
        run: ruff format --check .

      - name: Check docstring coverage
        run: interrogate graphein
