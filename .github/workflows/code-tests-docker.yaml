name: Code tests (docker)

on:
  pull_request:
    paths-ignore:
      - "README.md"
      - "CHANGELOG.md"
      - "CONTRIBUTORS.md"
      - "CONTRIBUTING.md"
      - "docs/**"

permissions:
  contents: read

jobs:
  code-tests-docker:
    name: Run code tests (docker)
    runs-on: "ubuntu-latest"
    permissions:
      contents: read
      id-token: write  # Codecov OIDC upload
    defaults:
      run:
        shell: bash -l {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # See: https://github.com/marketplace/actions/setup-miniconda
      - name: Setup micromamba
        uses: mamba-org/setup-micromamba@add3a49764cedee8ee24e82dfde87f5bc2914462 # v2.0.7
        with:
          micromamba-version: "latest"
          environment-name: test_env
          init-shell: bash
          create-args: python=3.11
          #cache-environment: true
          #cache-environment-key: environment-${{ steps.date.outputs.date }}
          #cache-downloads-key: downloads-${{ steps.date.outputs.date }}
          post-cleanup: "all"

      # # Build cache of environment
      # - name: Cache conda environment
      #   id: cache-environment
      #   uses: actions/cache@v2
      #   # Conda environment build step depends on two files,
      #   # so we ensure that the hash key contains both their hashes.
      #   with:
      #     path: |
      #       /usr/share/miniconda/envs/graphein-dev/
      #     key: ${{ runner.os }}-env.${{ hashFiles('environment-dev.yml') }}

      - name: Build Docker container
        # if: steps.cache-environment.outputs.cache-hit != 'true'
        run: |
          docker compose -f docker-compose.cpu.yml up -d --build

      - name: Install Graphein (Docker)
        run: |
          docker exec $(docker ps -q) bash -c 'pip install -e ".[dev,extras]"'

      - name: Run tests (Docker)
        run: |
          docker exec $(docker ps -q) bash -c 'pytest .'

      - name: Run example notebooks (Docker)
        run: |
          docker exec $(docker ps -q) bash -c 'grep -l smoke_test notebooks/*.ipynb | pytest --nbval-lax --nbval-current-env --cov-append'

      # coverage.xml is written to the repo, which is mounted in the container.
      # Same-repo PRs authenticate with OIDC (no secret needed); fork PRs
      # can't get an OIDC token and upload tokenless, which Codecov allows
      # for public repos.
      - name: Upload code coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.xml
          disable_search: true
          use_oidc: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
